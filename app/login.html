<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Acceso interno — Herederos de Cicumba</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="app-auth">
  <main class="auth-card">
    <a href="../index.html" class="auth-back">← Volver al sitio</a>

    <div class="auth-brand">
      <span class="brand__mark" aria-hidden="true">
        <span class="dot dot--rojo"></span>
        <span class="dot dot--verde"></span>
        <span class="dot dot--azul"></span>
        <span class="dot dot--amarillo"></span>
      </span>
      <h1>Herederos de <strong>Cicumba</strong></h1>
      <p>Sistema de gestión interno</p>
    </div>

    <form id="loginForm" class="auth-form" novalidate>
      <div class="field">
        <label for="email">Correo</label>
        <input type="email" id="email" name="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn--primary" style="width:100%">Ingresar</button>
      <p class="form__note" id="loginNote" role="status" aria-live="polite"></p>
    </form>

    <p class="auth-hint">
      El login con Supabase Auth se conecta en la <strong>Fase 3</strong>.
      Este formulario ya está preparado en <code>js/auth.js</code>.
    </p>
  </main>

  <!-- Supabase por CDN (se activa en fases posteriores) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
